name: "Pull Request"
on:
    pull_request:
        types: ['opened', 'reopened', 'synchronize']

jobs:
    has_changes:
        runs-on: ubuntu-latest
        outputs:
            changed: ${{steps.changes.outputs.changed}}
        steps:
            - uses: actions/checkout@v7
            - id: changes
              uses: dorny/paths-filter@v4
              with:
                filters: |
                    changed: packages/inversify-http-zod/src/**

    test:
        runs-on: ubuntu-latest
        needs: has_changes
        if: ${{needs.has_changes.outputs.changed}}
        steps:
            - uses: actions/setup-node@v7
              with:
                node-version: '24'
            - uses: actions/checkout@v7
            - run: |
                npm i
                npm test
              working-directory: packages/inversify-http-zod


    build:
        runs-on: ubuntu-latest
        needs: has_changes
        if: ${{needs.has_changes.outputs.changed}}
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                node-version: '24'
            - run: |
                npm i
                npm run build:prod
              working-directory: packages/inversify-http-zod
            - uses: actions/upload-artifact@v4
              with:
                name: dist
                path: packages/inversify-http-zod/dist

    publish:
        runs-on: ubuntu-latest
        needs: [build, test]
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                node-version: '24'
                registry-url: https://registry.npmjs.org
            - uses: actions/download-artifact@v5
              with:
                name: dist
            - run: npm publish --access public
              env:
                NODE_AUTH_TOKEN: ${{secrets.NPM_TOKEN}}
