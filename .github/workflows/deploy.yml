name: deploy
on:
    push:
        tags:
            - v*
        
jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
            - run: |
                npm i
                npm test
              working-directory: packages/inversify-http-zod

    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
            - run: |
                npm i
                npm run build:prod
              working-directory: packages/inversify-http-zod
            - uses: actions/upload-artifact@v7
              with:
                name: dist
                path: packages/inversify-http-zod/dist
    
    deploy:
        runs-on: ubuntu-latest
        needs: [build, test]
        steps:
            - uses: actions/checkout@v7
            - uses: actions/download-artifact@v7
              with:
                name: dist
                path: packages/inversify-http-zod/dist
            - uses: actions/setup-node@v7
              with:
                node-version: '24'
                registry-url: https://registry.npmjs.org
            - run: |
                npm i
                npm publish --access public
              working-directory:
                packages/inversify-http-zod
              env:
                NODE_AUTH_TOKEN: ${{secrets.NPM_DEPLOY}}
            